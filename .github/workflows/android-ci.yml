name: android-ci

# Minimal proof that the Android app actually compiles and its unit tests pass.
# Neither existed before: `release-apk.yml` only ran on a published release, so
# a release variant missing `app/google-services.json` — an APK that bricks at
# sign-in — shipped without a single CI signal.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: assembleRelease + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not set — the APK would ship without Firebase config and brick at sign-in."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      # app/build.gradle.kts creates the release signingConfig unconditionally and
      # points at the gitignored my-upload-key.jks, so assembleRelease cannot run
      # without the keystore.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — assembleRelease cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"

      - name: assembleRelease + testDebugUnitTest
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:testDebugUnitTest

      - name: Verify release APK carries Firebase config
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK produced."
            exit 1
          fi
          SCAN="$RUNNER_TEMP/apk-scan"
          rm -rf "$SCAN"; mkdir -p "$SCAN"
          unzip -o -q "$APK" -d "$SCAN" 'resources.arsc'

          fail=0
          for key in google_app_id gcm_defaultSenderId default_web_client_id; do
            if grep -a -q "$key" "$SCAN/resources.arsc"; then
              echo "firebase resource present: $key"
            else
              echo "::error::APK is missing the '$key' resource."
              fail=1
            fi
          done

          rm -rf "$SCAN"
          exit "$fail"

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
