name: release-apk

# Builds a signed release APK and attaches it to a published GitHub Release.
#
# Trigger: a Release is published (Releases -> Publish). Not on drafts.
#
# Signing: reuses the v3 upload keystore (alias "upload", hardcoded in
#   app/build.gradle.kts). The keystore + passwords come from repo secrets;
#   nothing sensitive is echoed. Required secrets:
#     KEYSTORE_BASE64    - base64 of my-upload-key.jks
#     KEYSTORE_PASSWORD  - store password (-> STORE_PASSWORD for gradle)
#     KEY_PASSWORD       - key password
#   (KEY_ALIAS secret exists too but the alias is hardcoded in gradle.)
#
# Artifacts uploaded to the release:
#   mystic-tarot.apk                 - STABLE name; the product page CDN links to
#                                      /releases/latest/download/mystic-tarot.apk
#   mystic-tarot-<tag>.apk           - versioned copy for traceability
# --clobber makes re-publishing idempotent.

on:
  release:
    types: [published]

permissions:
  contents: write   # gh release upload

concurrency:
  group: release-apk-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"

      # `app/google-services.json` is gitignored (.gitignore:19). Without this
      # step the build produced an APK with no google_app_id /
      # gcm_defaultSenderId / default_web_client_id, so FirebaseAuth.getInstance()
      # throws and MainActivity blocks forever on the sign-in gate. Mirrors
      # KineticAiCoach's release-apk.yml.
      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not set — the APK would ship without Firebase config and brick at sign-in."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Assemble signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate signed APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/release -name '*-release.apk' | head -n1)
          if [ -z "$apk" ]; then echo "No release APK found" >&2; exit 1; fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK is signed
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --verbose "${{ steps.apk.outputs.path }}"

      # Fixing the build inputs is not enough — assert against the bytes we are
      # about to publish. A dropped secret or a reverted gradle strategy fails here.
      - name: Verify built APK carries Firebase config
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          SCAN="$RUNNER_TEMP/apk-scan"
          rm -rf "$SCAN"; mkdir -p "$SCAN"
          unzip -o -q "$APK" -d "$SCAN" 'resources.arsc'

          fail=0
          for key in google_app_id gcm_defaultSenderId default_web_client_id; do
            if grep -a -q "$key" "$SCAN/resources.arsc"; then
              echo "firebase resource present: $key"
            else
              echo "::error::APK is missing the '$key' resource — google-services.json was not applied; the app bricks at sign-in."
              fail=1
            fi
          done

          rm -rf "$SCAN"
          exit "$fail"

      - name: Stage artifacts (stable + versioned names)
        run: |
          cp "${{ steps.apk.outputs.path }}" mystic-tarot.apk
          cp "${{ steps.apk.outputs.path }}" "mystic-tarot-${{ github.event.release.tag_name }}.apk"

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            mystic-tarot.apk \
            "mystic-tarot-${{ github.event.release.tag_name }}.apk" \
            --clobber
